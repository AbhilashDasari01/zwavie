<!DOCTYPE html>
<html lang="en">
<head>

    <title>ZWAVIE - Beat Responsive Visualizer</title>
<link rel="stylesheet" href="./resources/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
<canvas id="canvas"></canvas>
<!-- Mode Switch -->
 <div class="site-title">zwavie</div>

    <div class="social-icons">
        <a href="https://github.com/AbhilashDasari01" target="_blank" title="GitHub">
            <i class="fab fa-github"></i>
        </a>
        <a href="https://instagram.com/swaeguy" target="_blank" title="Instagram">
            <i class="fab fa-instagram"></i>
        </a>
        <a href="https://youtube.com/@swaeguy" target="_blank" title="YouTube">
            <i class="fab fa-youtube"></i>
        </a>
        <a href="https://discord.gg/yq8zuq5Ekw" target="_blank" title="Discord">
            <i class="fab fa-discord"></i>
        </a>
        <a href="https://facebook.com/swaeguy" target="_blank" title="Facebook">
            <i class="fab fa-facebook"></i>
        </a>
        <a href="mailto:swaeguy@gmail.com" title="Email">
            <i class="fas fa-envelope"></i>
        </a>
    </div>
</footer>
<script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
<script>
    kofiWidgetOverlay.draw('swaeguy', {
        'type': 'floating-chat',

        'floating-chat.donateButton.text-color': '#fff'

<script src="./resources/js/script.js"></script>
